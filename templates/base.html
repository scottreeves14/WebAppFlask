<!DOCTYPE html> 
<html lang="en"> 
<head> 
 <title>Flask Login App</title> 
</head> 
<body> 
 <nav> 
 <a href="{{ url_for('index') }}">Home</a> | 
 <!-- <a href="{{ url_for('login') }}">Login</a> |--> 
 
 
 {% if 'user' in session %} 
 <span>Welcome, {{ session['user'] }}</span> | 
 <a href="{{ url_for('logout') }}">Logout</a> 
 {% else %} 
 <a href="{{ url_for('login') }}">Login</a> | 
 <a href="{{ url_for('register') }}">Register</a> 
 {% endif %} 
 </nav> 
 <hr> 
 {% block content %}{% endblock %} 
</body> 
</html>
